name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / Windows
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Run isolated regression tests
        run: python -B -m unittest discover -s tests -v
      - name: Check syntax
        run: python -m compileall -q core ui tools main.py version.py

  package:
    name: Installer and portable package
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Build verified download packages
        shell: pwsh
        run: ./tools/build_release.ps1 -WithInstaller
      - name: Test English and French installation and removal
        shell: pwsh
        run: ./tools/test_installer.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Harpie-preview-windows-x64
          path: |
            dist/release/*.zip
            dist/release/*-setup-x64.exe
            dist/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
